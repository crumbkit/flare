# flare's adoption map of the Rust standards (adoption.md of
# https://github.com/crumbkit/rust-standards). The standards have no released
# version yet, so the map names the draft and the commit it was reviewed
# against.

schema = "rust-standards/adoption/v1"
standards = { version = "draft", commit = "117f4a8ad1a66ff7bceb15f9b3ebcb405507588b" }

# flare-core, flare-auth-oidc, flare-auth-loopback, flare-board and
# flare-render are libraries that other flare crates depend on.
# flare-auth-oidc starts /usr/bin/security to read its client secret and
# flare-board starts the board program, so they bring in child-process.
# flare-auth-loopback writes the server file that holds a running server's
# token, so it brings in durable-state. flare-server is an HTTP service, so
# it brings in service, and flare-cli builds the `flare` command, so it
# brings in cli. flare-server also serves a hosted site on a host behind a
# TLS proxy; the standards at this commit have no profile for a server that
# runs on hosts other than its author's, so the service profile covers it.
# flare-aws is a library that keeps shares and grants in DynamoDB and files
# in S3; the standards at this commit have no profile for a deployed store
# or for personal data, so the library and service profiles cover it.
# flare-contract is a library that holds the share API's request, response
# and problem types and generates their JSON Schema, so the base and
# library profiles cover it.
profiles = ["base", "library", "child-process", "durable-state", "service", "cli"]

[[binding]]
rule = "BASE-24"
owners = [
  "crates/flare-core/tests/support/fixed_authenticator.rs",
  "crates/flare-auth-oidc/src/flow.rs",
  "crates/flare-auth-oidc/src/session.rs",
  "crates/flare-auth-oidc/src/token.rs",
  "crates/flare-auth-loopback/src/secret.rs",
  "crates/flare-render/src/token.rs",
  "crates/flare-server/src/secret.rs",
  "crates/flare-server/src/sharing/tokens.rs",
  "crates/flare-cli/src/open.rs",
  "crates/flare-cli/src/client.rs",
  "crates/flare-cli/src/keychain.rs",
  "crates/flare-cli/src/login.rs",
]
checks = ["review: expose_secret appears only in the files listed in owners"]
note = "flare-core holds a credential's secret in a secrecy::SecretString inside Credential, and its source code never calls expose_secret. The test double FixedAuthenticator calls it once, to compare a presented bearer secret with the secret that the test gave it. flare-auth-oidc calls it in flow.rs to put the state, nonce and PKCE challenge in the authorisation URL, to seal a pending sign-in into the kept state and to read the sealed kept state, in session.rs to hash a session secret, and in token.rs to put the code, the PKCE verifier and the client secret in the token request body and to read the ID token. Its tests also call it, to read back what the code under test returned. flare-auth-loopback calls it only in secret.rs, which digests and compares the token, launch codes and session secrets, computes the probe's proof, composes the launch URL, opener page, cookie and server file from a secret, and hands the server file's bytes to the atomic writer. Its tests also call it, to read back what the code under test returned. flare-render holds the form token in FormToken, a SecretString, and calls it only in token.rs: to write the token into a form's hidden input and in FormToken's ExposeSecret implementation, which the server uses to look the token up. Its tests call it to read back the token a post carried. flare-server calls it only in secret.rs, which digests the hand-over codes and form tokens, compares digests in constant time, writes the session and kept-state cookies of both sites, including the hosted site's `__Host-` cookies, and composes the finish URL. Its share API calls it only in sharing/tokens.rs, to digest a new token's secret or a login code, to split a presented token into its id and secret, to write a new token into the exchange's answer and to write a login code into the redirect to the CLI's loopback listener. flare-cli calls it in open.rs, to put the server's token in the bearer header of the code request after the server has proved that it holds the token; in client.rs, to put the CLI token in the bearer header of a share API request; in keychain.rs, to write the CLI token to the standard input of /usr/bin/security; and in login.rs, to put the login code in the exchange's body."

[[binding]]
rule = "SVC-1"
owners = ["crates/flare-server/src/tasks.rs"]
checks = [
  "clippy disallowed_methods (clippy.toml)",
  "the shutdown test in crates/flare-server/tests/server/process.rs (SVC-2)",
]
note = "tasks.rs holds the JoinSet that owns each connection task and the sweep task; serve drains it within Limits::drain and aborts what remains. flare-auth-oidc's keychain.rs starts one reader thread per secret read, which ends when the child's output closes, and says so in its #[expect]. flare-cli's login.rs runs the browser opener on one blocking thread while it waits for the callback, joins it on every path before it returns, and says so in its #[expect]. Tests that start a task or a thread say in their #[expect] who joins it."

[[binding]]
rule = "PROC-1"
owners = ["crates/flare-cli/src/opener.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the open tests in crates/flare-cli/tests/serve.rs, which run a recording script in place of the opener (PROC-2)",
]
note = "Opening the opener file, or the server's /cli/login URL, in the browser is one of the flare command's two process operations: /usr/bin/open on macOS, xdg-open elsewhere, or FLARE_OPENER. Its module documentation states PROC-2's five items, and crumbkit-process stops the program's process group at the deadline (PROC-3)."

[[binding]]
rule = "PROC-1"
owners = ["crates/flare-cli/src/keychain.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the login and logout tests in crates/flare-cli/tests/sharing.rs, which run a recording script in place of /usr/bin/security (PROC-2)",
]
note = "Saving, reading and deleting the CLI token through /usr/bin/security, or FLARE_KEYCHAIN, is the flare command's other process operation. A save writes the token to the program's standard input, never to its command line. Its module documentation states PROC-2's five items, and crumbkit-process stops the program's process group at the deadline or the output limit (PROC-3)."

[[binding]]
rule = "PROC-1"
owners = ["crates/flare-auth-oidc/src/keychain.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the KeychainSecret tests in crates/flare-auth-oidc/tests/keychain.rs (PROC-2)",
]
note = "Reading the client secret through /usr/bin/security is the one process operation. Its module documentation states PROC-2's five items, and crumbkit-process stops the program's process group at the deadline or the output limit (PROC-3)."

[[binding]]
rule = "PROC-1"
owners = ["crates/flare-board/src/process.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the process tests in crates/flare-board/src/process/tests.rs and crates/flare-board/tests/limits.rs (PROC-2)",
]
note = "flare-board runs the board program for every read and write: get, get --at, ls, log and put --batch, one function each. Its module documentation states PROC-2's five items. crumbkit-process starts each child in a process group of its own and stops the whole group at the deadline or the output limit (PROC-3). A counting gate holds at most Limits::children children at once."

[[binding]]
rule = "DUR-1"
owners = ["crates/flare-auth-loopback/src/state/files.rs"]
checks = [
  "clippy disallowed_methods (clippy.toml)",
  "the reader-during-writes test in crates/flare-auth-loopback/tests/state.rs",
]
note = "crumbkit-durable writes the server file to .server.json.<pid>.<n>.tmp with mode 0600, syncs it, renames it over server.json and syncs the directory. The openers are new files of mode 0600 written with create_new in state/files.rs, without a rename. flare takes no file lock, so the DUR-2 entries of clippy.toml name no lock module."

[[binding]]
rule = "DUR-1"
owners = ["crates/flare-cli/src/login/saved.rs"]
checks = [
  "clippy disallowed_methods (clippy.toml)",
  "the login tests in crates/flare-cli/tests/sharing.rs",
]
note = "crumbkit-durable replaces the saved login, login.json in flare's state directory, whole with mode 0600, so a reader sees the old login or the new one. The file names the server, the token's id and label, and the owner; the token is only in the Keychain."

[[binding]]
rule = "DUR-4"
owners = ["crates/flare-auth-loopback/src/state.rs"]
checks = ["the remove_server tests in crates/flare-auth-loopback/tests/state.rs, one with a server that replaced the file"]
note = "remove_server removes server.json only while it holds the caller's token, compared in constant time. The sweep removes only temporary files and openers that the crate named, once they are more than 60 seconds old."

[[binding]]
rule = "SVC-12"
owners = [
  "crates/flare-aws/src/connect.rs",
  "crates/flare-aws/src/connect/stand_ins.rs",
  "crates/flare-aws/src/dynamodb.rs",
  "crates/flare-aws/src/s3.rs",
]
checks = [
  "clippy disallowed_types and disallowed_methods (clippy.toml): the SDK clients and their constructors",
  "cargo-deny bans (deny.toml): aws-config, aws-sdk-dynamodb and aws-sdk-s3 only through flare-aws",
]
note = "flare-aws is the only crate that depends on the AWS SDK. connect.rs loads the SDK config from the provider chain and builds both clients, and connect/stand_ins.rs builds them for the stand-ins behind the `testing` feature; dynamodb.rs and s3.rs hold each client behind a crate-private type, and every request goes through them. No public item of flare-aws names an SDK type, so a crate that uses the stores sees only flare-core's traits, the config type and Stores."

[[decision]]
id = "lanes"
requirement = """
- Lane: `lane` in .github/workflows/ci.yml, on each pull request and each push to main. It calls the shared lane, .github/workflows/rust-lane.yml of crumbkit/rust-standards at the commit that the `lane-commit` decision names, with `library: true`, so it runs every step of the pull-request lane in the standards' order (secrets, format, workflows, deny, shear, clippy, tests, doctests, rustdoc, features). Its check is `lane / lane`. Its tests step runs the default filter of .config/nextest.toml, which leaves out flare-aws, flare-board and flare-cli's hosted_stores test, because they need the board program or the stand-ins. It has no macOS job: the one macOS-only path, KeychainSecret, runs /usr/bin/security, and its tests run a fake program on Linux. flare-auth-loopback's platform code is POSIX file modes, ownership and links through std::os::unix, and it does not behave alike on Linux and macOS: on macOS a server file being renamed over can report 0 links, a rename can land between the lstat and the open, and the user id comes from the owner of a new pipe. The crate handles both and tests them on every platform through a testing hook, and the Linux job runs those tests. The macOS check is the flare-gates suite, which runs the workspace tests on the Mac that flare serves from; the lane has no macOS job. Its budget is ten minutes, the job's timeout.
- Lane: `flare` in .github/workflows/ci.yml, on each pull request and each push to main. It runs the steps of flare's lane that the shared lane lacks: the check that the flare command's dependency tree turns on no `testing` feature, flare-board's tests with `--ignore-default-filter` against the board program, and `cargo hack clippy --each-feature --lib`. It needs the `board` job, which builds the board program at a pinned crumbkit/board commit and caches it under a key that names the commit; a cached run restores it in seconds, and the first build of a new pin has its own 40-minute timeout. Its budget is ten minutes, the job's timeout.
- Lane: `hosted` in .github/workflows/ci.yml, on each pull request and each push to main. It runs flare-aws's tests and flare-cli's hosted_stores test with `--ignore-default-filter` against DynamoDB Local and SeaweedFS's S3 server, which it starts with `docker run` by digest, and checks the CloudFormation template with cfn-lint pinned by hash. The `lane` job leaves flare-aws out of its tests step only; its clippy, cargo hack, doctests and rustdoc steps build flare-aws. No stand-in enforces IAM, a bucket policy or a transaction conflict; the template's test pins the policies.
- Required checks: `main` has no branch protection and no ruleset, so no check is required and a merge waits for no check. No check is required until Luke adds a ruleset. A ruleset names `lane / lane`, `flare` and `hosted` as its required checks.
- Lane: `advisories` in .github/workflows/ci.yml, daily at 06:43 UTC and on each push to main (BASE-29). Nothing waits for it.
- Lane: release in .github/workflows/release.yml, on each push of a `v*` tag. It runs `advisories` (BASE-29), builds `flare` with `cargo auditable` (BASE-30) for aarch64-apple-darwin, aarch64-unknown-linux-gnu and x86_64-unknown-linux-gnu, runs the Homebrew tap's scripts/formula at a pinned commit on the archives, and attaches the archives and SHA256SUMS to the tag's GitHub release, which waits for all three. A pull request that changes the file builds the archives, runs the tap check and releases nothing.
"""
purpose = "The pull-request lane stays within ten minutes on a small workspace and grows with the code. A daily advisory run catches an advisory published against a dependency already on main, and finding it after merge is safe because the advisory concerns code that is already on main."
realizations = [".github/workflows/ci.yml", ".github/workflows/release.yml"]

[[decision]]
id = "lane-commit"
requirement = "The `lane` job in .github/workflows/ci.yml calls crumbkit/rust-standards' .github/workflows/rust-lane.yml at 5ba71ff31c5f5d8e69b34d04bb65bd0177f7ebeb, which is ahead of the commit that `standards.commit` names (117f4a8ad1a66ff7bceb15f9b3ebcb405507588b). The map still adopts the rules at 117f4a8. The change that takes the rules of a later commit moves `standards.commit` and the `uses:` line together."
purpose = "adoption.md asks the `uses:` line to name the commit that `standards.commit` names. The shared lane first exists at 5ba71ff, and taking that commit's other changes, such as its new clippy entries, is a change of its own, so the lane moves ahead of the map until that change lands."
realizations = [".github/workflows/ci.yml", "rust-standards.toml"]
