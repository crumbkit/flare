# hangar's adoption map of the Rust standards (adoption.md of
# https://github.com/crumbkit/rust-standards). The standards have no released
# version yet, so the map names the draft and the commit it was reviewed
# against.

schema = "rust-standards/adoption/v1"
standards = { version = "draft", commit = "117f4a8ad1a66ff7bceb15f9b3ebcb405507588b" }

# hangar-core, hangar-auth-oidc, hangar-auth-loopback, hangar-board and
# hangar-render are libraries that other hangar crates depend on.
# hangar-auth-oidc starts /usr/bin/security to read its client secret and
# hangar-board starts the board program, so they bring in child-process.
# hangar-auth-loopback writes the server file that holds a running server's
# token, so it brings in durable-state. hangar-server is an HTTP service, so
# it brings in service, and hangar-cli builds the `hangar` command, so it
# brings in cli. The standards also name a deployed profile for a server that
# runs on hosts other than its author's; this version runs on one Mac, so it
# is left for the change that hosts hangar.
profiles = ["base", "library", "child-process", "durable-state", "service", "cli"]

[[binding]]
rule = "BASE-24"
owners = [
  "crates/hangar-core/tests/support/fixed_authenticator.rs",
  "crates/hangar-auth-oidc/src/flow.rs",
  "crates/hangar-auth-oidc/src/session.rs",
  "crates/hangar-auth-oidc/src/token.rs",
  "crates/hangar-auth-loopback/src/secret.rs",
  "crates/hangar-render/src/token.rs",
  "crates/hangar-server/src/secret.rs",
  "crates/hangar-cli/src/open.rs",
]
checks = ["review: expose_secret appears only in the files listed in owners"]
note = "hangar-core holds a credential's secret in a secrecy::SecretString inside Credential, and its source code never calls expose_secret. The test double FixedAuthenticator calls it once, to compare a presented bearer secret with the secret that the test gave it. hangar-auth-oidc calls it in flow.rs to put the state, nonce and PKCE challenge in the authorisation URL and to compare the kept state, in session.rs to hash a session secret, and in token.rs to put the code, the PKCE verifier and the client secret in the token request body and to read the ID token. Its tests also call it, to read back what the code under test returned. hangar-auth-loopback calls it only in secret.rs, which digests and compares the token, launch codes and session secrets, computes the probe's proof, composes the launch URL, opener page, cookie and server file from a secret, and hands the server file's bytes to the atomic writer. Its tests also call it, to read back what the code under test returned. hangar-render holds the form token in FormToken, a SecretString, and calls it only in token.rs: to write the token into a form's hidden input and in FormToken's ExposeSecret implementation, which the server uses to look the token up. Its tests call it to read back the token a post carried. hangar-server calls it only in secret.rs, which digests the hand-over codes and form tokens, compares digests in constant time, writes the session and kept-state cookies and composes the finish URL. hangar-cli calls it only in open.rs, to put the server's token in the bearer header of the code request after the server has proved that it holds the token."

[[binding]]
rule = "SVC-1"
owners = ["crates/hangar-server/src/tasks.rs"]
checks = [
  "clippy disallowed_methods (clippy.toml)",
  "the shutdown test in crates/hangar-server/tests/server/process.rs (SVC-2)",
]
note = "tasks.rs holds the JoinSet that owns each connection task and the sweep task; serve drains it within Limits::drain and aborts what remains. hangar-auth-oidc's keychain.rs starts one reader thread per secret read, which ends when the child's output closes, and says so in its #[expect]. Tests that start a task or a thread say in their #[expect] who joins it."

[[binding]]
rule = "PROC-1"
owners = ["crates/hangar-cli/src/opener.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the open tests in crates/hangar-cli/tests/serve.rs, which run a recording script in place of the opener (PROC-2)",
]
note = "Opening the opener file in the browser is the hangar command's one process operation: /usr/bin/open on macOS, xdg-open elsewhere, or HANGAR_OPENER. Its module documentation states PROC-2's five items, and crumbkit-process stops the program's process group at the deadline (PROC-3)."

[[binding]]
rule = "PROC-1"
owners = ["crates/hangar-auth-oidc/src/keychain.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the KeychainSecret tests in crates/hangar-auth-oidc/tests/keychain.rs (PROC-2)",
]
note = "Reading the client secret through /usr/bin/security is the one process operation. Its module documentation states PROC-2's five items, and it stops only its direct child, not the child's descendants (PROC-3)."

[[binding]]
rule = "PROC-1"
owners = ["crates/hangar-board/src/process.rs"]
checks = [
  "clippy disallowed_methods and disallowed_types (clippy.toml)",
  "the process tests in crates/hangar-board/src/process/tests.rs and crates/hangar-board/tests/limits.rs (PROC-2)",
]
note = "hangar-board runs the board program for every read and write: get, get --at, ls, log and put --batch, one function each. Its module documentation states PROC-2's five items. crumbkit-process starts each child in a process group of its own and stops the whole group at the deadline or the output limit (PROC-3). A counting gate holds at most Limits::children children at once."

[[binding]]
rule = "DUR-1"
owners = ["crates/hangar-auth-loopback/src/state/files.rs"]
checks = [
  "clippy disallowed_methods (clippy.toml)",
  "the reader-during-writes test in crates/hangar-auth-loopback/tests/state.rs",
]
note = "The server file is written to server.json.<16 hex>.tmp with create_new and mode 0600, synced, renamed over server.json, and the directory is synced. The openers are new files written the same way without a rename. hangar takes no file lock, so the DUR-2 entries of clippy.toml name no lock module."

[[binding]]
rule = "DUR-4"
owners = ["crates/hangar-auth-loopback/src/state.rs"]
checks = ["the remove_server tests in crates/hangar-auth-loopback/tests/state.rs, one with a server that replaced the file"]
note = "remove_server removes server.json only while it holds the caller's token, compared in constant time. The sweep removes only temporary files and openers that the crate named, once they are more than 60 seconds old."

[[decision]]
id = "lanes"
requirement = """
- Lane: `lane` in .github/workflows/ci.yml, on each pull request and each push to main. It runs every step of the pull-request lane in the standards' order (format, workflows, deny, shear, clippy, tests, doctests, rustdoc, features). It has no macOS job: the one macOS-only path, KeychainSecret, runs /usr/bin/security, and its tests run a fake program on Linux. hangar-auth-loopback's platform code is POSIX file modes, ownership and links through std::os::unix, and it does not behave alike on Linux and macOS: on macOS a server file being renamed over can report 0 links, a rename can land between the lstat and the open, and the user id comes from the owner of a new pipe. The crate handles both and tests them on every platform through a testing hook, and the Linux job runs those tests. The macOS check is the hangar-gates suite, which runs the workspace tests on the Mac that hangar serves from; the lane has no macOS job. Its budget is ten minutes, the job's timeout. A merge waits for it. It needs the `board` job, which builds the board program at a pinned crumbkit/board commit for hangar-board's tests and caches it under a key that names the commit; a cached run restores it in seconds, and the first build of a new pin has its own 40-minute timeout.
- Lane: `advisories` in .github/workflows/ci.yml, daily at 06:43 UTC and on each push to main (BASE-29). Nothing waits for it.
"""
purpose = "The pull-request lane stays within ten minutes on a small workspace and grows with the code. A daily advisory run catches an advisory published against a dependency already on main, and finding it after merge is safe because the advisory concerns code that is already on main."
realizations = [".github/workflows/ci.yml"]
