[package]
name = "flare-aws"
description = "flare's share, grant and file stores, kept in DynamoDB and S3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-config.workspace = true
aws-lc-rs.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
flare-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[features]
# Exposes Stores::connect_at, which points the stores at a local stand-in
# with fixed made-up keys, and the faults that the outcome tests inject.
testing = []

[dev-dependencies]
flare-aws = { path = ".", features = ["testing"] }
flare-core = { workspace = true, features = ["testing"] }
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
