[package]
name = "flare-cli"
description = "The flare command: serve pages and bindings from a board, open them, publish pages, save bindings and share files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The library holds the whole command, so the convention tests can pass its
# parser and tool record to crumbkit-test beside the built binary. The
# binary calls `flare_cli::run`.
[lib]
name = "flare_cli"
path = "src/lib.rs"

[[bin]]
name = "flare"
path = "src/main.rs"

[dependencies]
clap.workspace = true
crumbkit.workspace = true
# crumbkit-durable replaces the saved login file whole (DUR-1).
crumbkit-durable.workspace = true
crumbkit-process.workspace = true
crumbkit-usage.workspace = true
flare-auth-loopback.workspace = true
flare-auth-oidc.workspace = true
flare-board.workspace = true
# The DynamoDB and S3 stores behind the hosted site's share API.
flare-aws.workspace = true
# The share API's request, response and problem types, which the sharing
# commands send and read.
flare-contract.workspace = true
flare-core.workspace = true
flare-render.workspace = true
flare-server.workspace = true
reqwest.workspace = true
schemars.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# The hosted_stores test runs the built `flare serve` against stand-in
# DynamoDB and S3 servers and a fake OpenID provider over TLS. No dev-dependency
# here turns on a `testing` feature of a flare crate: the flare command's own
# tree must stay as it ships, and CI checks that.
[dev-dependencies]
aws-lc-rs.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-s3.workspace = true
base64.workspace = true
crumbkit-test.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rcgen.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true
url.workspace = true

# cargo-shear reads only the files under this crate, and the two SDK crates
# are used by flare-aws's tests/support/stand_in_raw.rs, which
# tests/hosted_stores.rs includes with #[path] to create its table and
# bucket.
[package.metadata.cargo-shear]
ignored = ["aws-sdk-dynamodb", "aws-sdk-s3"]

[lints]
workspace = true
