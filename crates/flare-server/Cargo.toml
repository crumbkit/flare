[package]
name = "flare-server"
description = "flare's HTTP server: pages, bindings, edit forms and sign-in on a person's own machine or behind a TLS proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
form_urlencoded.workspace = true
# The share API's request, response and problem types.
flare-contract.workspace = true
flare-auth-loopback.workspace = true
flare-auth-oidc.workspace = true
flare-board.workspace = true
flare-core.workspace = true
flare-render.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
# Decodes each uploaded image under limits, and strips its metadata.
image.workspace = true
img-parts.workspace = true
hyper-util = { workspace = true, features = ["tokio", "server", "server-graceful", "http1"] }
secrecy.workspace = true
# Reads the share API's JSON bodies into the contract's types.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tracing.workspace = true
# Parses and normalises the hosted site's public origin.
url.workspace = true

[build-dependencies]
# Reads Vite's manifest, which names the reading page's entry script.
serde_json.workspace = true

[features]
# Exposes PublicOrigin::loopback_http, an http origin on localhost for tests
# that serve a hosted site without TLS. The flare command never enables
# it, and a CI step fails when its dependency tree does. The crate's own
# tests turn it on through the dev-dependency below.
testing = []

[dev-dependencies]
flare-server = { path = ".", features = ["testing"] }
flare-auth-oidc = { workspace = true, features = ["testing"] }
flare-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
