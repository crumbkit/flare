[package]
name = "hangar-auth-oidc"
description = "Signs people in to hangar with an OpenID Connect provider such as Google"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
# Runs the Keychain reader with a deadline, an output limit and its own
# process group (PROC-2).
crumbkit-process.workspace = true
hangar-core.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# One sign-in at a time fetches the key set again, and the others wait for
# it; reqwest already brings tokio in.
tokio = { workspace = true, features = ["sync"] }
url.workspace = true

[features]
# Exposes the switches that only tests need: an http issuer on a loopback
# address, another program and deadline for KeychainSecret, a shorter request
# deadline and a clock that tests move by hand. The crate's own tests turn it
# on through the dev-dependency below.
testing = []

[dev-dependencies]
hangar-auth-oidc = { path = ".", features = ["testing"] }
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["macros", "rt", "net"] }

[lints]
workspace = true
