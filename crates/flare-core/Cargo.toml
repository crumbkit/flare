[package]
name = "flare-core"
description = "Types, traits and contract tests that every flare crate shares"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Flares::search runs a parsed search over the caller's shares.
flare-query.workspace = true
secrecy.workspace = true
# DocumentTeams reads a deployment's teams document, which is JSON. Both
# crates are already in the graph through flare-contract and flare-server.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# Exposes helpers that only tests need, such as MemoryRecordStore::seed, which
# replaces a record without checking its blob. The crate's own tests turn it
# on through the dev-dependency below.
testing = []

[dev-dependencies]
flare-core = { path = ".", features = ["testing"] }
proptest.workspace = true

[lints]
workspace = true
