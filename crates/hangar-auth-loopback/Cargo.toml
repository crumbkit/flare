[package]
name = "hangar-auth-loopback"
description = "Signs in the person who runs a local hangar server with one-use launch codes and a per-launch host name"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aws-lc-rs.workspace = true
# Writes the server file atomically (DUR-1).
crumbkit-durable.workspace = true
hangar-core.workspace = true
http.workspace = true
libc.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[features]
# Exposes the switches that only tests need: a hook between the steps of a
# server file read, and a user id to read as. The crate's own tests turn it
# on through the dev-dependency below.
testing = []

[dev-dependencies]
hangar-auth-loopback = { path = ".", features = ["testing"] }
