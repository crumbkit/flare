# hangar reads no environment variable and sleeps nowhere, so no module owns
# those calls and each reason says what to do instead. Starting a process is
# owned by crates/hangar-auth-oidc/src/keychain.rs and
# crates/hangar-board/src/process.rs (PROC-1). When a later
# crate needs one of these calls, that crate names its owning module in the
# reason of the entry (BASE-5). The durable-state entries (DUR-1, DUR-2)
# come from the durable-state profile. hangar-auth-loopback's
# state/files.rs writes its new private files, and it is the only library module that
# suppresses them to write. hangar-auth-oidc's file_secret.rs suppresses
# OpenOptions::new to open the client secret file read-only. Tests that
# write fixture files suppress them too, each with its reason.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
allow-indexing-slicing-in-tests = true
too-many-lines-threshold = 150 # BASE-10
max-fn-params-bools = 3 # BASE-16

disallowed-methods = [
    # DUR-1: the atomic writer is crumbkit-durable; the new private files that
    # are never replaced are written by crates/hangar-auth-loopback/src/state/files.rs.
    { path = "std::fs::write", reason = "replace durable files with crumbkit-durable, and write new private files in hangar-auth-loopback's state/files.rs" },
    { path = "std::fs::copy", reason = "replace durable files with crumbkit-durable, and write new private files in hangar-auth-loopback's state/files.rs" },
    { path = "std::fs::rename", reason = "replace durable files with crumbkit-durable, and write new private files in hangar-auth-loopback's state/files.rs" },
    { path = "std::fs::File::create", reason = "replace durable files with crumbkit-durable, and write new private files in hangar-auth-loopback's state/files.rs" },
    { path = "std::fs::OpenOptions::new", reason = "replace durable files with crumbkit-durable, and write new private files in hangar-auth-loopback's state/files.rs" },
    # DUR-2: hangar takes no file lock. A crate that needs one names its lock
    # module, which owns the deadline, in these reasons.
    { path = "std::fs::File::lock", reason = "hangar takes no file lock; add a lock module that owns the deadline" },
    { path = "std::fs::File::try_lock", reason = "hangar takes no file lock; add a lock module that owns the deadline" },
    { path = "std::fs::File::lock_shared", reason = "hangar takes no file lock; add a lock module that owns the deadline" },
    { path = "std::fs::File::try_lock_shared", reason = "hangar takes no file lock; add a lock module that owns the deadline" },
    # BASE-6
    { path = "std::env::var", reason = "read the environment snapshot" },
    { path = "std::env::var_os", reason = "read the environment snapshot" },
    { path = "std::env::vars", reason = "only the entry point captures the environment" },
    { path = "std::env::vars_os", reason = "only the entry point captures the environment" },
    { path = "std::env::set_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::remove_var", reason = "build a snapshot in the test instead" },
    { path = "std::env::current_dir", reason = "read the directory from the snapshot" },
    { path = "std::env::set_current_dir", reason = "pass the directory to the operation instead" },
    # BASE-7
    { path = "std::process::exit", reason = "return the exit code from main so destructors run" },
    # BASE-11
    { path = "std::thread::sleep", reason = "wait for an observable signal, or sleep in the clock owner" },
    { path = "tokio::time::sleep", reason = "wait for an observable signal, or sleep in the clock owner", allow-invalid = true },
    # PROC-1: the process modules are crates/hangar-auth-oidc/src/keychain.rs
    # and crates/hangar-board/src/process.rs.
    { path = "std::process::Command::new", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board" },
    { path = "std::process::Command::spawn", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board" },
    { path = "std::process::Command::status", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board" },
    { path = "std::process::Command::output", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "replacing this process bypasses the crate's process module: keychain.rs or process.rs" },
    { path = "tokio::process::Command::new", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board", allow-invalid = true },
    { path = "tokio::process::Command::spawn", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board", allow-invalid = true },
    { path = "tokio::process::Command::status", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board", allow-invalid = true },
    { path = "tokio::process::Command::output", reason = "start processes through the crate's process module: keychain.rs in hangar-auth-oidc, process.rs in hangar-board", allow-invalid = true },
    # SVC-1 (the service profile): hangar-server's tasks.rs spawns every
    # task, and a JoinSet there owns each one. Other crates spawn a thread
    # only with an owner that joins it, and say so in an #[expect].
    { path = "std::thread::spawn", reason = "spawn through the task owner, hangar-server's tasks.rs, which joins or aborts" },
    { path = "tokio::spawn", reason = "spawn through the task owner, hangar-server's tasks.rs, which joins or aborts", allow-invalid = true },
    { path = "tokio::task::spawn", reason = "spawn through the task owner, hangar-server's tasks.rs, which joins or aborts", allow-invalid = true },
    { path = "tokio::task::spawn_blocking", reason = "spawn through the task owner, hangar-server's tasks.rs, which joins or aborts", allow-invalid = true },
    # CLI-1 (the cli profile): crumbkit's output owns the standard streams
    # of the hangar command, and hangar-cli's log.rs owns the server's log
    # on standard error.
    { path = "std::io::stdout", reason = "write through crumbkit's output" },
    { path = "std::io::stderr", reason = "write through crumbkit's output, or log through hangar-cli's log.rs" },
    { path = "std::io::stdin", reason = "read through crumbkit's output, which knows whether input is a terminal" },
]

disallowed-types = [
    # PROC-1
    { path = "std::process::Child", reason = "let the crate's process module, keychain.rs or hangar-board's process.rs, hold the child, which owns its deadline and cleanup" },
]

# BASE-7: hangar's only error crate is thiserror, which has no untyped-error
# macro, so the list is empty. A crate that adds anyhow or miette lists its
# untyped-error macros here.
disallowed-macros = []
